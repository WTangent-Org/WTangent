name: ci

# 提交级构建检查：push main / 任何 PR（含 release-please PR）都编译验证，失败则禁止合并。
# Core/生成器为平级源码引用（ProjectReference），Components 仓坏了空壳构建即挂——这是有意的依赖。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: WTangent

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Core/生成器源码(平级目录,与工作区布局一致;ProjectReference 相对路径依赖此布局)
      - uses: actions/checkout@v4
        with:
          repository: WTangent-Org/WTangent.Components
          path: WTangent.Components

      - name: dotnet build（Release）
        run: dotnet build WTangent/WTangent.csproj -c Release --nologo
