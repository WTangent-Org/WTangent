name: release

# wtangent（空壳启动器）发布：release-please 管版本 → 合并后构建 wtangent 七平台 → 上传 release
# install.ps1/install.sh 从这里下载 wtangent-win-x64.exe 等资产
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: '手动指定版本（如 0.5.1；留空则按提交类型自动）'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      # 手动发版模式：仅 workflow_dispatch（手动）或 release PR 合并（创建 release）才跑 release-please；普通提交不发版
      - name: 判断本次是否值得发版
        id: should
        run: |
          MSG=$(git log -1 --format=%s)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "手动触发 → 发版"
          elif echo "$MSG" | grep -qE '^chore\(main\): release'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "release PR 合并 → 创建 release"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "普通提交 → 不发版（要发版：Actions 页手动运行 release workflow）"
          fi

      - uses: googleapis/release-please-action@v4
        if: steps.should.outputs.run == 'true'
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ github.event.inputs.version }}

      # 自动合并 release PR（PAT，绕过 GITHUB_TOKEN 限制）
      - name: 自动合并 release PR（squash）
        if: steps.release.outputs.prs != '' && steps.release.outputs.prs != '[]'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          PR_NUMBER=$(echo '${{ steps.release.outputs.prs }}' | python3 -c "import json,sys; prs=json.load(sys.stdin); print(prs[0]['number'])")
          for i in $(seq 1 300); do
            STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json mergeStateStatus --jq '.mergeStateStatus' 2>&1 || echo UNKNOWN)
            echo "PR #$PR_NUMBER mergeState: $STATE"
            if [ "$STATE" = "CLEAN" ]; then break; fi
            sleep 5
          done
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --delete-branch
          echo "已自动 squash 合并 release PR #$PR_NUMBER"

  build:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/checkout@v4

      # 编译期引用组件源码（ExcludeAssets=runtime，dll 不随空壳发布）
      - uses: actions/checkout@v4
        with:
          repository: wtommy932/Agent.Server
          path: deps/Agent.Server

      - uses: actions/checkout@v4
        with:
          repository: wtommy932/Agent.Client
          path: deps/Agent.Client

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建 wtangent 七平台
        run: |
          mkdir -p out
          declare -A rids=(
            [win-x64]=wtangent-win-x64.exe
            [win-arm64]=wtangent-win-arm64.exe
            [linux-x64]=wtangent-linux-x86_64
            [linux-arm64]=wtangent-linux-aarch64
            [linux-arm]=wtangent-linux-arm
            [osx-x64]=wtangent-osx-x64
            [osx-arm64]=wtangent-osx-arm64
          )
          for rid in "${!rids[@]}"; do
            dotnet publish WTangent.csproj -c Release -r $rid --self-contained \
              -p:PublishSingleFile=true -p:PublishTrimmed=false -o out/$rid
            find out/$rid -maxdepth 1 -type f \( -name "wtangent" -o -name "wtangent.exe" \) -exec mv {} out/${rids[$rid]} \;
          done
          ls -la out/

      - name: 上传 release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            out/wtangent-*
